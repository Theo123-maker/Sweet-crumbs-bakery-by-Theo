
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Enquiries | Sweet Crumbs Bakery</title>

    <meta name="description"
        content="Send Sweet Crumbs Bakery a product enquiry about cakes, cupcakes, bread, pastries and special orders.">

    <meta name="keywords"
        content="Bakery enquiries, cake orders, cupcake orders, special orders">

    <meta name="robots" content="index, follow">

    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>

<header>
    <div class="logo">
        <a href="index.html">Sweet Crumbs Bakery</a>
    </div>

    <nav aria-label="Main navigation">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="enquiry.html">Enquiry</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main>

    <section class="page-header">

        <h1>Product Enquiry</h1>

        <p>
            Ask us about our products, prices,
            availability and special orders.
        </p>

    </section>

    <!-- Product Enquiry Form -->
    <section class="form-container">

        <form id="enquiry-form">

            <label for="customer-name">
                Full Name:
            </label>

            <input
                type="text"
                id="customer-name"
                name="customerName"
                placeholder="Enter your full name"
                required
                minlength="2"
                maxlength="80"
            >

            <label for="customer-email">
                Email Address:
            </label>

            <input
                type="email"
                id="customer-email"
                name="customerEmail"
                placeholder="Enter your email address"
                required
            >

            <label for="product-type">
                Select Product:
            </label>

            <select
                id="product-type"
                name="productType"
                required>

                <option value="">Choose a product</option>
                <option value="celebration cakes">Celebration Cakes</option>
                <option value="cupcakes">Cupcakes</option>
                <option value="bread">Bread</option>
                <option value="pastries">Pastries</option>
                <option value="cookies">Cookies</option>
                <option value="custom order">Custom Order</option>

            </select>

            <label for="quantity">
                Quantity:
            </label>

            <input
                type="number"
                id="quantity"
                name="quantity"
                min="1"
                max="500"
                value="1"
                required
            >

            <label for="required-date">
                Date Required:
            </label>

            <input
                type="date"
                id="required-date"
                name="requiredDate"
                required
            >

            <label for="enquiry-message">
                Additional Details:
            </label>

            <textarea
                id="enquiry-message"
                name="message"
                maxlength="1000"
                placeholder="Tell us about the flavour, size, design or other requirements.">
            </textarea>

            <button type="submit" class="btn">
                Submit Enquiry
            </button>

            <p
                id="enquiry-response"
                class="form-response"
                role="status"
                aria-live="polite">
            </p>

        </form>

    </section>

</main>

<footer>
    <p>
        &copy; <span id="current-year">2026</span>
        Sweet Crumbs Bakery. All rights reserved.
    </p>

    <p>Freshly baked with love.</p>
</footer>

</body>
</html>
